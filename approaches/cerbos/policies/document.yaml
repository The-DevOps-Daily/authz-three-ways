apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: document
  importDerivedRoles: [document_roles]
  rules:
    - actions: [view]
      effect: EFFECT_ALLOW
      derivedRoles: [team_viewer]

    - actions: [edit]
      effect: EFFECT_ALLOW
      derivedRoles: [team_editor]

    - actions: [view, edit, delete]
      effect: EFFECT_ALLOW
      roles: [admin]
