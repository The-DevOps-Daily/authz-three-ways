apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: document
  rules:
    - actions: [view]
      effect: EFFECT_ALLOW
      roles: [viewer, editor, admin]

    - actions: [edit]
      effect: EFFECT_ALLOW
      roles: [editor, admin]

    - actions: [delete]
      effect: EFFECT_ALLOW
      roles: [admin]
