apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: document
  importDerivedRoles: [document_roles]
  rules:
    - actions: [view]
      effect: EFFECT_ALLOW
      derivedRoles: [team_viewer, shared_viewer, shared_editor]

    - actions: [edit]
      effect: EFFECT_ALLOW
      derivedRoles: [team_editor, shared_editor]

    - actions: [view, edit, delete]
      effect: EFFECT_ALLOW
      roles: [admin]

    # Contractors get nothing outside their own teams, whatever else grants it.
    - actions: ["*"]
      effect: EFFECT_DENY
      roles: ["*"]
      condition:
        match:
          all:
            of:
              - expr: request.principal.attr.contractor == true
              - expr: "!(request.resource.attr.team in request.principal.attr.teams)"
