apiVersion: api.cerbos.dev/v1
derivedRoles:
  name: document_roles
  definitions:
    - name: team_viewer
      parentRoles: [viewer, editor]
      condition:
        match:
          expr: request.resource.attr.team in request.principal.attr.teams

    - name: team_editor
      parentRoles: [editor]
      condition:
        match:
          expr: request.resource.attr.team in request.principal.attr.teams

    - name: shared_viewer
      parentRoles: ["*"]
      condition:
        match:
          expr: request.principal.id in request.resource.attr.viewers

    - name: shared_editor
      parentRoles: ["*"]
      condition:
        match:
          expr: request.principal.id in request.resource.attr.editors
